<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نشاط فريق كريم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: phone-first single column. A navy band carries the stage tracker; the four leaders are portrait tabs, and each stage is worked one leader at a time as a dossier. */
:root{
  --bg:#F6F9FE; --surface:#FFFFFF; --ink:#080828; --ink2:#1E2340; --muted:#5E6680;
  --line:#D5DFF1; --tint:#EBF4FF; --accent:#0E7C7B; --accent-fg:#FFFFFF;
  --band:#080828; --band2:#1E2340; --band-fg:#FFFFFF; --band-muted:#A3ACCB; --gold:#FFBC3A;
  --fahd:#4D88E8; --noura:#40BDA9; --omar:#FFBC3A; --layan:#F26A44;
  --warn:#B4441F; --shadow:0 6px 22px rgba(8,8,40,.08);
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080828; --surface:#14183C; --ink:#F2F5FD; --ink2:#D8DEF2; --muted:#9BA5C6;
    --line:#2B315C; --tint:#1C2354; --accent:#40BDA9; --accent-fg:#080828;
    --band:#04041A; --band2:#14183C; --warn:#F58B6B; --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080828; --surface:#14183C; --ink:#F2F5FD; --ink2:#D8DEF2; --muted:#9BA5C6;
  --line:#2B315C; --tint:#1C2354; --accent:#40BDA9; --accent-fg:#080828;
  --band:#04041A; --band2:#14183C; --warn:#F58B6B; --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.85;direction:rtl;text-align:right}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
strong{font-weight:600}

.band{background:linear-gradient(160deg,var(--band),var(--band2));color:var(--band-fg);padding-block:18px 16px;padding-inline:16px}
.band-in,.wrap{max-width:680px;margin-inline:auto}
.eyebrow{font-size:13px;color:var(--band-muted)}
.band h1{font-family:var(--display);font-size:22px;line-height:1.5;margin-top:2px;text-wrap:balance}
.track{display:flex;gap:6px;margin-top:14px}
.track li{flex:1;min-width:0;font-size:12.5px;color:var(--band-muted);border-top:3px solid var(--band-muted);padding-top:6px;opacity:.6}
.track li.on{color:var(--band-fg);border-color:var(--gold);opacity:1;font-weight:600}
.track li.done{color:var(--band-fg);border-color:var(--noura);opacity:.95}

main{padding-inline:16px;padding-block:22px 40px}
.wrap{display:flex;flex-direction:column;gap:20px}
.lead{display:flex;flex-direction:column;gap:10px}
.kicker{font-size:13px;font-weight:600;color:var(--accent)}
h2{font-family:var(--display);font-size:21px;line-height:1.6;text-wrap:balance}
h3{font-family:var(--display);font-size:17px;line-height:1.6}
.muted{color:var(--muted)}
.small{font-size:14px}

.pf{flex:none;width:var(--s,48px);height:var(--s,48px);border-radius:50%;object-fit:cover;display:block;background:var(--tint);box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--c)}

/* scenario opener */
.scene{background:linear-gradient(160deg,var(--band),var(--band2));color:var(--band-fg);border-radius:18px;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.scene h2{font-size:22px}
.scene .kicker{color:var(--gold)}
.scene p{color:var(--band-fg)}
.stack{display:flex;padding-inline-start:10px}
.stack .pf{--s:64px;margin-inline-start:-10px;box-shadow:0 0 0 3px var(--band2),0 0 0 5.5px var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips li{border:1px solid var(--band-muted);border-radius:999px;padding:3px 12px;font-size:14px;color:var(--band-fg)}
.scene .hl{border-top:1px solid var(--band-muted);padding-top:12px}

/* leader tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;scroll-margin-top:12px}
.tab{background:none;border:0;border-radius:14px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;min-width:0}
.tab .pf{--s:56px;opacity:.55;filter:saturate(.6)}
.tab span{font-family:var(--display);font-size:14.5px;color:var(--muted)}
.tab.on{background:var(--surface);box-shadow:var(--shadow)}
.tab.on .pf,.tab.ok .pf{opacity:1;filter:none}
.tab.on span{color:var(--ink)}
.tab .tick{position:absolute;top:6px;inset-inline-start:calc(50% + 14px);width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:12px;line-height:20px;text-align:center;font-weight:700}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible,.cell:focus-visible,.slot:focus-visible,.pool button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:16px;padding-inline-start:4px}
.who .pf{--s:84px}
.who-txt{min-width:0;line-height:1.6}
.who-name{font-family:var(--display);font-size:21px}
.who-role{font-size:14.5px;color:var(--ink2)}
.who-meta{font-size:13px;color:var(--muted)}
.quote{background:var(--tint);border-radius:4px 14px 14px 14px;padding:9px 14px;color:var(--ink2);align-self:flex-start}
.task{background:var(--tint);border-radius:10px;padding:8px 12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts li{border:1px solid var(--line);border-radius:12px;padding:8px 10px;line-height:1.55;min-width:0}
.facts span{display:block;font-size:13px;color:var(--muted)}
.facts b{font-weight:600;font-size:15px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14.5px}
details > div{margin-top:8px;display:flex;flex-direction:column;gap:8px;color:var(--ink2);font-size:15px}

.q{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.q-title{font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:right;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;line-height:1.55;background:var(--surface);min-width:0}
.opt b{display:block;font-weight:600;font-size:15px}
.opt i{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.opt.on{border-color:var(--accent);background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--accent)}

/* readiness matrix */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cell{position:relative;min-height:112px;text-align:right;border:1.5px dashed var(--line);border-radius:14px;background:var(--bg);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;line-height:1.5;min-width:0}
.cell b{font-size:13.5px;font-weight:600}
.cell.on{border-style:solid;border-color:var(--accent);background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cell .here{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding:4px}
.cell .pf{--s:34px;opacity:.5}
.cell .pf.me{--s:46px;opacity:1}
.axis{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}

/* ranking */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{background:var(--bg);border:1.5px dashed var(--line);border-radius:14px;padding:10px 2px;min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0}
.slot .n{font-family:var(--display);font-size:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot.set{border-style:solid;border-color:var(--accent);background:var(--tint)}
.slot.set .n{font-size:13px;color:var(--accent)}
.slot .pf{--s:50px}
.slot span.nm{font-size:13.5px;font-weight:600}
.scale{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.pool{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:4px}.pool:empty{display:none}
.pool button{background:none;border:0;padding:4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
.pool .pf{--s:56px}

textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;line-height:1.7}
textarea{min-height:80px;resize:vertical}
textarea:focus,input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}

.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:600;background:var(--accent);color:var(--accent-fg);width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#080828}
.btn.link{background:none;color:var(--muted);width:auto;padding:6px 0;font-weight:500;font-size:14px;text-decoration:underline}
.nav{display:flex;gap:8px}
.hint{font-size:14px;color:var(--muted);text-align:center}
.err{color:var(--warn);font-size:14px}

.sealed{background:linear-gradient(160deg,var(--band),var(--band2));color:var(--band-fg);border-radius:14px;padding:22px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.sealed p{font-family:var(--display);font-size:17px}
.news{display:flex;flex-direction:column;gap:10px;border-inline-start:3px solid var(--gold);padding-inline-start:12px}

.discuss{background:linear-gradient(160deg,var(--band),var(--band2));color:var(--band-fg);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:6px}
.discuss .kicker{color:var(--gold)}
.discuss p{font-family:var(--display);font-size:18px;line-height:1.7;text-wrap:balance}
.gate-row{display:flex;gap:8px;flex-wrap:wrap}
.gate-row input{flex:1;min-width:140px;text-align:center;letter-spacing:.2em}
.gate-row .btn{width:auto;flex:none}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding-block:12px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .pf{--s:46px}
.row-txt{flex:1;min-width:0;line-height:1.6}
.row-txt b{font-family:var(--display);font-size:16px;font-weight:600}
.row-txt span{display:block;font-size:14px;color:var(--ink2)}
.row-txt i{font-style:normal;color:var(--muted)}
.big{flex:none;font-family:var(--display);font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.move{flex:none;font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--tint);color:var(--ink2)}
.move.up{background:var(--accent);color:var(--accent-fg)}
.note{font-size:15px;color:var(--ink2);background:var(--tint);border-radius:10px;padding:8px 12px}
.lens{display:flex;gap:6px}
.lens i{flex:1;height:14px;border-radius:999px;background:var(--layan)}
.lens i.env{background:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--layan);margin-inline-end:6px}
.legend span.env::before{background:var(--accent)}
footer{padding-inline:16px;padding-block:0 28px;text-align:center}

@media (max-width:380px){ .opts,.facts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:no-preference){
  .opt,.cell,.slot,.tab{transition:border-color .15s,background-color .15s,box-shadow .15s}
  .tab .pf{transition:opacity .2s,filter .2s}
  .enter > *{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
  .enter > *:nth-child(2){animation-delay:.07s}.enter > *:nth-child(3){animation-delay:.14s}.enter > *:nth-child(4){animation-delay:.21s}.enter > *:nth-child(n+5){animation-delay:.28s}
  .swap{animation:up .35s cubic-bezier(.2,.7,.2,1) both}
  .pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
  .stack .pf{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  .stack .pf:nth-child(2){animation-delay:.1s}.stack .pf:nth-child(3){animation-delay:.2s}.stack .pf:nth-child(4){animation-delay:.3s}
}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
</style>
</head>

  if (d.go){ S.view=d.go; S.cur=0; render("top"); return; }
  if (d.code){ var k=d.code, inp=document.getElementById("code-"+k);
    if (norm(inp.value)===CONFIG.codes[k]){ S.view=k; S.cur=0; render("top"); } else { document.getElementById("err-"+k).hidden=false; inp.focus(); } }
});
app.addEventListener("input",function(e){ var t=e.target; if(t.dataset.txt==="why"){ S.why=t.value; save(); } else if(t.dataset.txt==="change"){ S.change[t.dataset.l]=t.value; save(); } });
app.addEventListener("keydown",function(e){ if(e.key==="Enter" && e.target.id && e.target.id.indexOf("code-")===0){ var b=app.querySelector('[data-code="'+e.target.id.slice(5)+'"]'); if(b) b.click(); } });

var rs=document.getElementById("reset"), armed=false;
rs.addEventListener("click",function(){
  if(!armed){ armed=true; rs.textContent="اضغط مرة أخرى لتأكيد مسح جميع الإجابات"; setTimeout(function(){ armed=false; rs.textContent="البدء من جديد"; },4000); return; }
  armed=false; rs.textContent="البدء من جديد"; S=fresh(); render("top");
});
render("top");
</script>
</body>
</html>
